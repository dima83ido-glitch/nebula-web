<script>

const API = "https://nebula-web-nwdf.onrender.com"

let currentUser = ""
let auth_id = ""
let selectedChats = []

// ========================= PAGES =========================

function openPage(pageId){

    document
        .querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"))

    document
        .getElementById(pageId)
        .classList.add("active")
}

// ========================= AUTO LOGIN =========================

window.onload = async () => {

    const u = localStorage.getItem("nebula_user")
    const p = localStorage.getItem("nebula_pass")

    if(u && p){

        document.getElementById("loginUsername").value = u
        document.getElementById("loginPassword").value = p

        await login()
    }
}

// ========================= LOGIN =========================

async function login(){

    const username = document
        .getElementById("loginUsername")
        .value
        .trim()

    const password = document
        .getElementById("loginPassword")
        .value
        .trim()

    const remember = document
        .getElementById("remember")
        .checked

    if(!username || !password){

        return alert("Введите логин и пароль")
    }

    try{

        const res = await fetch(API + "/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username,
                password,
                remember
            })
        })

        const d = await res.json()

        if(!d.status){

            return alert(d.message || "Ошибка входа")
        }

        currentUser = username

        document.getElementById("nickname").innerText = username

        if(remember){

            localStorage.setItem(
                "nebula_user",
                username
            )

            localStorage.setItem(
                "nebula_pass",
                password
            )

        }else{

            localStorage.removeItem("nebula_user")
            localStorage.removeItem("nebula_pass")
        }

        if(d.role === "admin"){

            document
                .getElementById("adminPanel")
                .style
                .display = "block"

        }else{

            document
                .getElementById("adminPanel")
                .style
                .display = "none"
        }

        openPage("dashboard")

    }catch(e){

        console.log(e)

        alert("Сервер недоступен")
    }
}

// ========================= LOGOUT =========================

function logout(){

    localStorage.removeItem("nebula_user")
    localStorage.removeItem("nebula_pass")

    currentUser = ""

    openPage("loginPage")
}

// ========================= SEND CODE =========================

async function sendCode(){

    try{

        const proxy = document
            .getElementById("proxy")
            .value
            .trim()

        const useProxy = document
            .getElementById("use_proxy")
            .checked

        const res = await fetch(API + "/send_code", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                username: currentUser,

                phone: document
                    .getElementById("phone")
                    .value
                    .trim(),

                api_id: document
                    .getElementById("api_id")
                    .value
                    .trim(),

                api_hash: document
                    .getElementById("api_hash")
                    .value
                    .trim(),

                proxy: useProxy ? proxy : null
            })
        })

        const d = await res.json()

        if(!d.status){

            return alert(d.message)
        }

        auth_id = d.auth_id

        document
            .getElementById("codeBlock")
            .style
            .display = "block"

    }catch(e){

        console.log(e)

        alert("Ошибка подключения")
    }
}

// ========================= VERIFY CODE =========================

async function verifyCode(){

    try{

        const res = await fetch(API + "/verify_code", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                auth_id,

                code: document
                    .getElementById("code")
                    .value
                    .trim()
            })
        })

        const d = await res.json()

        if(d.need_password){

            document
                .getElementById("passwordBlock")
                .style
                .display = "block"

            return
        }

        if(!d.status){

            return alert(d.message)
        }

        alert("Аккаунт добавлен")

        openPage("dashboard")

    }catch(e){

        console.log(e)

        alert("Ошибка")
    }
}

// ========================= VERIFY PASSWORD =========================

async function verifyPassword(){

    try{

        const res = await fetch(API + "/verify_password", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                auth_id,

                password: document
                    .getElementById("password2fa")
                    .value
                    .trim()
            })
        })

        const d = await res.json()

        if(!d.status){

            return alert(d.message)
        }

        alert("Аккаунт добавлен")

        openPage("dashboard")

    }catch(e){

        console.log(e)

        alert("Ошибка")
    }
}

// ========================= ACCOUNTS =========================

async function loadAccounts(){

    openPage("accountsPage")

    try{

        const res = await fetch(API + "/accounts", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: currentUser
            })
        })

        const d = await res.json()

        const list = document.getElementById("accountsList")

        if(!d.accounts || d.accounts.length === 0){

            list.innerHTML = `
            <div class="empty">
                Нет аккаунтов
            </div>
            `

            return
        }

        let html = ""

        d.accounts.forEach(acc => {

            html += `
            <div class="section-card">

                <strong>${acc.phone}</strong>

                <button
                    onclick="deleteAccount(${acc.id})"
                    style="
                        float:right;
                        background:#ef4444;
                        color:white;
                        border:none;
                        padding:8px 12px;
                        border-radius:8px;
                    "
                >
                    Удалить
                </button>

            </div>
            `
        })

        list.innerHTML = html

    }catch(e){

        console.log(e)

        alert("Ошибка загрузки")
    }
}

// ========================= DELETE ACCOUNT =========================

async function deleteAccount(id){

    if(!confirm("Удалить аккаунт?")) return

    try{

        await fetch(API + "/delete_account", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                account_id: id
            })
        })

        await loadAccounts()

    }catch(e){

        console.log(e)

        alert("Ошибка удаления")
    }
}

// ========================= LOAD MAILINGS =========================

async function loadMailings(){

    openPage("mailingsPage")

    try{

        const res = await fetch(API + "/mailings", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: currentUser
            })
        })

        const d = await res.json()

        const container = document.getElementById("mailingsList")

        if(!d.mailings || d.mailings.length === 0){

            container.innerHTML = `
            <div class="empty">
                Нет рассылок
            </div>
            `

            return
        }

        let html = ""

        d.mailings.forEach(m => {

            const active = m.status === "active"

            html += `
            <div class="section-card">

                <strong>${m.name}</strong>

                <br>

                <small>
                    Аккаунт: ${m.phone}
                </small>

                <br><br>

                <button
                    onclick="toggleMailing(${m.id}, '${active ? "stopped" : "active"}')"
                    style="
                        background:${active ? "#ef4444" : "#22c55e"};
                        color:white;
                        border:none;
                        padding:10px 14px;
                        border-radius:10px;
                    "
                >
                    ${active ? "Остановить" : "Запустить"}
                </button>

                <button
                    onclick="deleteMailing(${m.id})"
                    style="
                        background:#ef4444;
                        color:white;
                        border:none;
                        padding:10px 14px;
                        border-radius:10px;
                        margin-left:10px;
                    "
                >
                    Удалить
                </button>

            </div>
            `
        })

        container.innerHTML = html

    }catch(e){

        console.log(e)

        alert("Ошибка загрузки")
    }
}

</script>
